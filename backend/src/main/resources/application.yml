spring:
  application:
    name: pizza-order-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pizzaria}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

pizzaria:
  nome: ${PIZZARIA_NOME:Pede Pizza}

impressora:
  host: ${IMPRESSORA_HOST:localhost}
  porta: ${IMPRESSORA_PORTA:9100}
  timeout-conexao-milissegundos: ${IMPRESSORA_TIMEOUT_CONEXAO_MS:3000}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:60}
